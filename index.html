<!DOCTYPE html>
<html>
<head>
    <title>Add New Item</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Add a New Item</h1>
    <form id="itemForm" enctype="multipart/form-data">
        <label for="name">Item Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="description">Description:</label>
        <textarea id="description" name="description"></textarea>

        <label for="price">Price ($):</label>
        <input type="number" id="price" name="price" step="0.01" required>

        <label for="image">Image:</label>
        <input type="file" id="image" name="image" accept="image/*">

        <label for="kleinanzeigen_state">State:</label>
        <input type="text" id="kleinanzeigen_state" name="kleinanzeigen_state">

        <label for="kleinanzeigen_date">Date:</label>
        <input type="date" id="kleinanzeigen_date" name="kleinanzeigen_date">

        <input type="submit" value="Add Item">
    </form>
    <br>
    <a href="view_items.php">View All Items</a>

    <!-- Include jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Add the AJAX script -->
    <script>
    $(document).ready(function() {
        $('#itemForm').submit(function(event) {
            event.preventDefault(); // Prevent the default form submission

            // Create FormData object to handle file upload
            var formData = new FormData(this);

            // Send the data using AJAX
            $.ajax({
                type: 'POST',
                url: 'add_item_ajax.php',
                data: formData,
                dataType: 'json',
                encode: true,
                processData: false,
                contentType: false
            })
            .done(function(data) {
                if (data.success) {
                    alert('Item added successfully!');
                    $('#itemForm')[0].reset(); // Reset the form
                } else {
                    alert('Error: ' + data.message);
                }
            })
            .fail(function(xhr, status, error) {
                alert('An error occurred: ' + error);
            });
        });
    });
    </script>
</body>
</html>
